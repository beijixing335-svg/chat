<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <meta name="theme-color" content="#8BAAC4">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <link rel="manifest" href="manifest.json">
 <title>字卡聊天</title>
 <style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 :root{--primary:#8BAAC4;--bg:#EDEDED;--bubble-other:#8BAAC4;--bubble-self:#D9A0A0;--radius:18px;--bubble-style:round;--chat-font:system;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
 html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);touch-action:manipulation}
 #app{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);background-size:cover;background-position:center;position:relative;overflow:hidden}
 #app.has-bg .bubble-other{background:rgba(139,170,196,0.85);backdrop-filter:blur(6px)}
 #app.has-bg .bubble-self{background:rgba(217,160,160,0.85);backdrop-filter:blur(6px)}
 .font-system{font-family:-apple-system,system-ui,sans-serif}
 .font-round{font-family:"PingFang SC","Microsoft YaHei","圆体-简",sans-serif}
 .font-hand{font-family:"ZCOOL KuaiLe","Comic Sans MS",cursive}
 .font-kai{font-family:"STKaiti","KaiTi",serif}
 .font-bold{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700}
 .font-thin{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:300}
 .header{flex-shrink:0;height:56px;padding:0 12px;background:var(--primary);display:flex;align-items:center;justify-content:space-between;z-index:10;padding-top:var(--safe-top);position:relative}
 .header-left{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
 .header-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);object-fit:cover;flex-shrink:0;font-size:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500}
 .header-name{font-size:17px;font-weight:600;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
 .header-right{display:flex;gap:4px;flex-shrink:0}
 .header-btn{width:36px;height:36px;border:none;background:rgba(255,255,255,0.18);border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.15s}
 .header-btn:active{transform:scale(0.9)}
 .msg-list{flex:1;overflow-y:auto;padding:14px 14px 8px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
 .msg-list::-webkit-scrollbar{width:3px}
 .msg-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:10px}
 .msg-item{display:flex;align-items:flex-end;gap:8px;max-width:88%;animation:fadeUp 0.3s ease;position:relative}
 .msg-item.self{flex-direction:row-reverse;align-self:flex-end}
 .msg-item .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;font-size:13px;display:flex;align-items:center;justify-content:center;background:#ddd;border:1px solid rgba(0,0,0,0.06);font-weight:500;color:#666}
 .msg-item .msg-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
 .msg-content{display:flex;flex-direction:column;max-width:calc(100% - 40px)}
 .msg-item .bubble{padding:10px 14px;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,0.06);font-size:15px;line-height:1.6;word-break:break-word;color:#1A1A1A;position:relative}
 .msg-item .bubble .quote-block{font-size:13px;color:#666;background:rgba(0,0,0,0.06);border-left:3px solid #999;padding:4px 10px;margin-bottom:6px;border-radius:4px;word-break:break-word}
 .msg-item:not(.self) .bubble{background:var(--bubble-other)}
 .msg-item.self .bubble{background:var(--bubble-self)}
 .bubble-style-corner .msg-item:not(.self) .bubble{border-bottom-left-radius:4px}
 .bubble-style-corner .msg-item.self .bubble{border-bottom-right-radius:4px}
 .bubble-style-gradient .msg-item:not(.self) .bubble{background:linear-gradient(135deg,#e8f0fe,#d4e4f7);color:#1a2a4a}
 .bubble-style-gradient .msg-item.self .bubble{background:linear-gradient(135deg,#D9A0A0,#c48a8a);color:#1a3a1a}
 .bubble-style-glass .msg-item:not(.self) .bubble{background:rgba(255,255,255,0.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3)}
 .bubble-style-glass .msg-item.self .bubble{background:rgba(217,160,160,0.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(217,160,160,0.3)}
 .bubble-style-neon .msg-item:not(.self) .bubble{background:#0a0a1a;color:#00f5ff;border:1px solid #00f5ff;box-shadow:0 0 20px rgba(0,245,255,0.15),inset 0 0 20px rgba(0,245,255,0.05)}
 .bubble-style-neon .msg-item.self .bubble{background:#0a0a1a;color:#ff6bff;border:1px solid #ff6bff;box-shadow:0 0 20px rgba(255,107,255,0.15),inset 0 0 20px rgba(255,107,255,0.05)}
 .bubble-style-neon #app{background:#0a0a1a!important}
 .bubble-style-neon .header{background:#1a1a3a;border-bottom:1px solid rgba(0,245,255,0.2)}
 .bubble-style-neon .footer{background:rgba(10,10,26,0.9);border-top:1px solid rgba(0,245,255,0.1)}
 .bubble-style-neon .footer-input{background:#1a1a3a;color:#00f5ff}
 .bubble-style-neon .footer-input::placeholder{color:#555}
 .bubble-style-neon .msg-item .bubble .quote-block{background:rgba(255,255,255,0.08);border-left-color:#00f5ff;color:#aac}
 .msg-time{font-size:10px;color:#999;margin-top:2px;padding:0 4px;opacity:0.6}
 .msg-item.self .msg-time{text-align:right}
 .msg-read{font-size:10px;color:#B0B0B0;margin-top:1px;padding:0 4px;text-align:right;opacity:0.7;user-select:none}
 .footer{flex-shrink:0;padding:8px 12px calc(8px + var(--safe-bottom));background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,0.04);display:flex;flex-direction:column;gap:6px}
 .footer .footer-row{display:flex;align-items:center;gap:8px}
.footer-plus{width:40px;height:40px;border:none;border-radius:50%;background:rgba(180,180,190,0.25);color:rgba(80,80,90,0.6);font-size:20px;cursor:pointer;flex-shrink:0;transition:0.25s ease;display:flex;align-items:center;justify-content:center;border:1px solid rgba(180,180,190,0.3)}
.footer-plus:active{transform:scale(0.9)}
.plus-menu{position:fixed;z-index:10002;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.2);padding:6px 0;min-width:140px;display:none;animation:fadeUp 0.15s ease;overflow:hidden}
.plus-menu.active{display:block}
.plus-menu .menu-item{padding:10px 20px;font-size:14px;color:#333;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:10px}
.plus-menu .menu-item:active{background:#f0f0f0}
.emoji-panel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:10000;display:none}
.emoji-panel-overlay.open{display:flex;align-items:flex-end;justify-content:center}
.emoji-panel-inner{width:100%;max-width:500px;background:#fff;border-radius:20px 20px 0 0;padding:16px 12px calc(12px + var(--safe-bottom));max-height:60vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.emoji-item,.emoji-add-item{aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.emoji-item img{width:100%;height:100%;object-fit:cover}
.emoji-item:active{transform:scale(0.9);opacity:0.8}
.emoji-add-item{font-size:32px;color:#bbb;border:2px dashed #ddd}
.emoji-add-item:active{background:#eee}
.emoji-item .emoji-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.emoji-item .emoji-del:active{background:rgba(255,0,0,0.75)}
.emoji-panel-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:12px;color:#333}
.emoji-close-btn{position:absolute;top:12px;right:16px;width:30px;height:30px;border:none;background:#f0f0f0;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.emoji-close-btn:active{background:#ddd}
 .msg-item .bubble img.emoji-img{max-width:160px;max-height:160px;border-radius:10px;display:block;margin:4px 0}
 .msg-item .emoji-only .bubble{background:transparent!important;box-shadow:none;padding:2px}
 .msg-item .emoji-only .bubble img.emoji-img{max-width:180px;max-height:180px}
 .footer-input{flex:1;height:40px;border:none;border-radius:20px;background:#F0F0F0;padding:0 16px;font-size:15px;outline:none;color:#333}
 .footer-input::placeholder{color:#bbb;font-size:14px}
 .footer-btn{height:40px;padding:0 18px;border:none;border-radius:20px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0;transition:0.15s}
 .footer-btn:active{transform:scale(0.94);opacity:0.8}
 .footer-btn:disabled{opacity:0.4;transform:none}
 .footer-call{width:40px;height:40px;border:none;border-radius:50%;background:rgba(180,180,190,0.25);color:rgba(80,80,90,0.6);font-size:16px;cursor:pointer;flex-shrink:0;transition:0.25s ease;display:flex;align-items:center;justify-content:center;border:1px solid rgba(180,180,190,0.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
 .footer-call:active{transform:scale(0.9)}
 .footer-call.on{background:rgba(255,120,120,0.2);border-color:rgba(255,120,120,0.3);color:rgba(200,80,80,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
 .quote-bar{display:none;align-items:center;gap:8px;padding:4px 12px 2px 12px;font-size:13px;color:#555;background:rgba(0,0,0,0.04);border-radius:10px;margin:0 4px}
 .quote-bar.active{display:flex}
 .quote-bar .quote-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#666}
 .quote-bar .quote-cancel{width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,0.08);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#999}
 .quote-bar .quote-cancel:active{transform:scale(0.9)}
 .call-float{position:fixed;bottom:100px;right:16px;z-index:9998;display:none;flex-direction:column;align-items:center;animation:floatIn 0.4s ease;touch-action:none;cursor:grab}
 .call-float.active{display:flex}
 .call-float.dragging{cursor:grabbing;transition:none}
 @keyframes floatIn{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
 .call-float .ball{width:60px;height:60px;border-radius:50%;background:rgba(200,200,210,0.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(0,0,0,0.08),0 0 0 1px rgba(200,200,210,0.25);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid rgba(210,210,220,0.35);position:relative;user-select:none;-webkit-user-select:none;transition:box-shadow 0.4s ease}
 .call-float .ball .mini-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;font-size:12px;display:flex;align-items:center;justify-content:center;background:rgba(180,180,190,0.2);color:rgba(70,70,80,0.6);font-weight:500}
 .call-float .ball .mini-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
 .call-float .ball .mini-timer{color:rgba(70,70,80,0.5);font-size:10px;font-weight:400;font-family:"Courier New",monospace;margin-top:1px;letter-spacing:1px}
 .call-float .ball .pulse-ring{position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;border-radius:50%;border:1.5px solid rgba(180,180,190,0.2);animation:pulseRing 3s infinite;pointer-events:none}
 @keyframes pulseRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
 .call-mini-window{position:fixed;bottom:180px;right:16px;z-index:9999;background:rgba(220,220,230,0.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px;padding:18px 22px;display:none;flex-direction:column;align-items:center;min-width:150px;animation:floatIn 0.35s cubic-bezier(0.16,1,0.3,1);border:1.5px solid rgba(210,210,220,0.4);box-shadow:0 8px 32px rgba(0,0,0,0.06)}
 .call-mini-window.active{display:flex}
 .call-mini-window .mw-avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;font-size:20px;display:flex;align-items:center;justify-content:center;background:rgba(200,200,210,0.2);color:rgba(70,70,80,0.5);border:1.5px solid rgba(200,200,210,0.3);font-weight:400}
 .call-mini-window .mw-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
 .call-mini-window .mw-name{color:rgba(70,70,80,0.5);font-size:13px;font-weight:400;margin-top:8px;letter-spacing:1px}
 .call-mini-window .mw-timer{color:rgba(60,60,70,0.45);font-size:32px;font-weight:200;font-family:"Courier New",monospace;margin:6px 0 12px 0;letter-spacing:2px}
 .call-mini-window .mw-hangup{width:44px;height:44px;border:none;border-radius:50%;background:rgba(200,200,210,0.2);color:rgba(70,70,80,0.4);font-size:16px;cursor:pointer;transition:0.25s ease;display:flex;align-items:center;justify-content:center;border:1px solid rgba(200,200,210,0.3)}
 .call-mini-window .mw-hangup:active{transform:scale(0.88);background:rgba(255,120,120,0.25);border-color:rgba(255,120,120,0.35);color:rgba(200,80,80,0.6)}
 .empty-tip{text-align:center;color:#bbb;font-size:14px;margin-top:40px;line-height:2}
 .empty-tip span{font-size:20px;display:block;margin-bottom:6px}
 .settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:999;display:none}
 .settings-overlay.open{display:block}
 .settings-panel{position:absolute;right:0;top:0;width:88%;max-width:400px;height:100%;background:#fff;padding:20px 16px calc(20px + var(--safe-bottom));overflow-y:auto;animation:slideIn 0.3s ease;-webkit-overflow-scrolling:touch}
 @keyframes slideIn{0%{transform:translateX(100%)}100%{transform:translateX(0)}}
 .settings-panel::-webkit-scrollbar{width:3px}
 .settings-panel::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px}
 .settings-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
 .settings-close{width:32px;height:32px;border:none;background:#f0f0f0;border-radius:50%;font-size:18px;cursor:pointer}
 .setting-group{margin-bottom:18px}
 .setting-group-label{font-size:13px;font-weight:600;color:#888;margin-bottom:6px;letter-spacing:0.3px}
 .setting-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;gap:8px}
 .setting-row:last-child{border-bottom:none}
 .setting-label{font-size:14px;color:#333;flex-shrink:0}
 .setting-label small{color:#999;font-size:11px;display:block}
 .theme-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
 .theme-dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:0.15s;flex-shrink:0}
 .theme-dot.active{border-color:#333;transform:scale(1.1);box-shadow:0 0 0 2px #fff,0 0 0 4px #333}
 .theme-dot:active{transform:scale(0.9)}
 .card-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f5f5f5;font-size:14px;gap:6px}
 .card-item .card-text{flex:1;word-break:break-word}
 .card-item .card-del{color:#ff6b6b;border:none;background:none;font-size:18px;cursor:pointer;padding:0 4px}
 .card-add-row{display:flex;gap:6px;margin-top:4px}
 .card-add-row input{flex:1;padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
 .card-add-row input:focus{border-color:var(--primary)}
 .card-add-row button{padding:6px 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
 .card-batch-area{margin-top:4px}
 .card-batch-area textarea{width:100%;height:60px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;resize:vertical;outline:none;font-family:inherit}
 .card-batch-area textarea:focus{border-color:var(--primary)}
 .card-batch-actions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
 .card-batch-actions button{padding:4px 10px;border:none;border-radius:6px;font-size:12px;cursor:pointer;background:#f0f0f0;color:#333}
 .card-batch-actions button.primary{background:var(--primary);color:#fff}
 .card-count{font-size:12px;color:#999;margin-top:4px}
 .btn-danger{padding:4px 12px;border:none;border-radius:6px;background:#ff6b6b;color:#fff;font-size:12px;cursor:pointer}
 .btn-outline{padding:4px 12px;border:1px solid #ddd;border-radius:6px;background:transparent;color:#333;font-size:12px;cursor:pointer}
 .hidden-input{display:none}
 .style-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
 .style-grid button{padding:4px 12px;border:1px solid #ddd;border-radius:12px;background:transparent;font-size:12px;cursor:pointer;color:#666}
 .style-grid button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
 .font-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
 .font-grid button{padding:4px 12px;border:1px solid #ddd;border-radius:12px;background:transparent;font-size:12px;cursor:pointer;color:#666}
 .font-grid button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
 .avatar-row{display:flex;gap:16px;align-items:center}
 .avatar-row .av-item{display:flex;flex-direction:column;align-items:center;gap:4px}
 .avatar-row .av-item .av-preview{width:48px;height:48px;border-radius:50%;object-fit:cover;font-size:18px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border:2px solid #ddd;cursor:pointer;font-weight:500;color:#999}
 .avatar-row .av-item .av-preview img{width:100%;height:100%;border-radius:50%;object-fit:cover}
 .avatar-row .av-item .av-label{font-size:11px;color:#999}
 .color-picker-group{margin-top:4px}
 .color-picker-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
 .color-picker-row .picker-label{font-size:13px;color:#555;min-width:70px;flex-shrink:0}
 .color-grid{display:flex;flex-wrap:wrap;gap:5px}
 .color-dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:0.15s;flex-shrink:0}
 .color-dot.active{border-color:#333;transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 0 0 4px #333}
 .color-dot:active{transform:scale(0.9)}
 .speed-row{display:flex;align-items:center;gap:8px;padding:4px 0}
 .speed-row label{font-size:13px;color:#555;min-width:60px;flex-shrink:0}
 .speed-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#ddd;border-radius:2px;outline:none}
 .speed-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
 .speed-row .speed-value{font-size:14px;font-weight:600;color:#333;min-width:40px;text-align:center}
 .card-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;padding:4px 0}
 .card-pagination button{padding:4px 12px;border:1px solid #ddd;border-radius:6px;background:transparent;font-size:12px;cursor:pointer;color:#666}
 .card-pagination button:disabled{opacity:0.3;cursor:not-allowed}
 .card-pagination button:active:not(:disabled){transform:scale(0.95)}
 .card-pagination .page-info{font-size:12px;color:#999}

 /* 长按菜单 */
 .longpress-menu{position:fixed;z-index:10001;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);padding:6px 0;min-width:120px;display:none;animation:fadeUp 0.15s ease;overflow:hidden}
 .longpress-menu.active{display:block}
 .longpress-menu .menu-item{padding:10px 20px;font-size:14px;color:#333;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:10px}
 .longpress-menu .menu-item:active{background:#f0f0f0}

<script>
 var DB_NAME='card_chat_db';
var STORE_NAME='data_store';
var KEY='card_chat_data_v3';
var defaultData={
 myName:'我',
 otherName:'TA',
 myAvatar:'',
 otherAvatar:'',
 bg:'',
 theme:'#8BAAC4',
 bubbleStyle:'round',
 chatFont:'system',
 cards:[],
 messages:[],

 myBubbleColor:'#D9A0A0',
 playlist:[{name:'天气之子',artist:'STRlighT',id:'1973129951'}],otherBubbleColor:'#8BAAC4',
 speedMin:5,
 speedMax:15,
 quoteProbability:30,
 stickers:[],
 stickerProb:20
};
var data=JSON.parse(JSON.stringify(defaultData));
var dbReady=false;
var dbPending=[];

function openDB(){
 return new Promise(function(resolve,reject){
 var req=indexedDB.open(DB_NAME,1);
 req.onupgradeneeded=function(e){
 var db=e.target.result;
 if(!db.objectStoreNames.contains(STORE_NAME)){
 db.createObjectStore(STORE_NAME);
 }
 };
 req.onsuccess=function(e){
 resolve(e.target.result);
 };
 req.onerror=function(e){
 resolve(null);
 };
 });
}

function loadFromDB(db){
 return new Promise(function(resolve){
 try{
 var tx=db.transaction(STORE_NAME,'readonly');
 var store=tx.objectStore(STORE_NAME);
 var req=store.get(KEY);
 req.onsuccess=function(){
 var raw=req.result;
 if(raw){
 var d=JSON.parse(raw);
 for(var k in defaultData) if(!(k in d)) d[k]=defaultData[k];
 resolve(d);
 }else{
 resolve(JSON.parse(JSON.stringify(defaultData)));
 }
 };
 req.onerror=function(){
 resolve(JSON.parse(JSON.stringify(defaultData)));
 };
 }catch(e){
 resolve(JSON.parse(JSON.stringify(defaultData)));
 }
 });
}

function saveToDB(db){
 if(!db) return;
 try{
 var tx=db.transaction(STORE_NAME,'readwrite');
 var store=tx.objectStore(STORE_NAME);
 store.put(JSON.stringify(data),KEY);
 }catch(e){}
}

openDB().then(function(db){
 if(db){
 return loadFromDB(db).then(function(d){
 data=d;
 dbReady=true;
 window._cardDB=db;
 saveToDB(db);
 initAfterDataReady();
 // 移除重复的 dbPending 中的 initAfterDataReady
 dbPending = dbPending.filter(function(fn){ return fn !== initAfterDataReady; });
 while(dbPending.length){dbPending.shift()(); }
 });
 }else{
 data=JSON.parse(JSON.stringify(defaultData));
 dbReady=true;
 initAfterDataReady();
 dbPending = dbPending.filter(function(fn){ return fn !== initAfterDataReady; });
 while(dbPending.length){dbPending.shift()(); }
 }
});

function loadData(){
 return JSON.parse(JSON.stringify(defaultData));
}
function saveData(){
 data.lastVisit=Date.now();
 if(dbReady && window._cardDB){
 saveToDB(window._cardDB);
 }
}

 }
 longpressMenu.classList.add('active');

// ====== 回复队列系统 ======
var replyQueue = [];
var isProcessing = false;

function pickRandomQuote(){
 if(data.messages.length===0) return null;
 var prob=data.quoteProbability||30;
 if(Math.random()*100 > prob) return null;
 var candidateMsg='';
 var candidates=[];
 for(var i=data.messages.length-1;i>=0;i--){
  var m=data.messages[i];
  if(!m.self) continue;
  candidates.push({text:m.text, self:true, idx:i});
  if(candidates.length>=10) break;
 }
 if(candidates.length>0 && Math.random()<0.7){
  candidateMsg=candidates[Math.floor(Math.random()*candidates.length)];
 }else{
  for(var j=data.messages.length-1;j>=0;j--){
   var m2=data.messages[j];
   if(m2.self) continue;
   candidates.push({text:m2.text, self:false, idx:j});
   if(candidates.length>=20) break;
  }
  if(candidates.length>0){
   candidateMsg=candidates[Math.floor(Math.random()*candidates.length)];
  }
 }
 if(candidateMsg){
  return {text:candidateMsg.text, self:candidateMsg.self};
 }
 return null;
}

function enqueueReply(text, delay, forceQuote) {
 replyQueue.push({ text: text, delay: delay, forceQuote: forceQuote });
 processQueue();
}

function processQueue() {
 if (isProcessing) return;
 if (replyQueue.length === 0) return;
 isProcessing = true;
 var item = replyQueue.shift();
 setTimeout(function() {
  var quote='';
  if(item.forceQuote){
   quote=item.forceQuote;
  }else{
   quote=pickRandomQuote();
  }
  addMessage(item.text, false, null, quote);
  isProcessing = false;
  if (replyQueue.length > 0) {
   processQueue();
  }
 }, item.delay * 1000);
}

// ====== 定时主动触发 ======
var lastInteraction = Date.now();
var autoTriggerInterval = null;

function checkAutoTrigger() {
 var now = Date.now();
 var diff = (now - lastInteraction) / 1000 / 60;
 if (diff >= 2) {
  var count = Math.floor(diff / 2);
  if (count < 1) count = 1;
  if (count > 5) count = 5;
  var randCount = Math.floor(Math.random() * 2) + 1;
  var actualCount = Math.min(count, randCount);
  if (diff > 10) actualCount = Math.min(count, 5);
  
  for (var i = 0; i < actualCount; i++) {
   if (data.cards.length === 0) break;
   var card = data.cards[Math.floor(Math.random() * data.cards.length)];
   var delay = getRandomDelay();
   enqueueReply(card, delay);
  }
  lastInteraction = now;
  saveData();
 }
}

function getRandomDelay() {
 var min = data.speedMin || 5;
 var max = data.speedMax || 15;
 if (min > max) { var tmp = min; min = max; max = tmp; }
 return Math.floor(Math.random() * (max - min + 1) + min);
}

function startAutoTrigger() {
 if (autoTriggerInterval) clearInterval(autoTriggerInterval);
 autoTriggerInterval = setInterval(function() {
  checkAutoTrigger();
 }, 30000);
}

document.addEventListener('visibilitychange', function() {
 if (!document.hidden) {
  checkAutoTrigger();
 }
});

function updateInteraction() {
 lastInteraction = Date.now();
 saveData();
}

// ====== 拖拽 ======
var dragState={
 isDragging:false,
 startX:0,startY:0,
 offsetX:0,offsetY:0,
 moved:false
};
function onDragStart(e){
 if(!callFloat.classList.contains('active'))return;
 var touch=e.touches?e.touches[0]:e;
 var rect=callFloat.getBoundingClientRect();
 dragState.isDragging=true;
 dragState.moved=false;
 dragState.offsetX=touch.clientX-rect.left;
 dragState.offsetY=touch.clientY-rect.top;
 dragState.startX=touch.clientX;
 dragState.startY=touch.clientY;
 callFloat.classList.add('dragging');
 callFloat.style.transition='none';
 e.preventDefault();
}
function onDragMove(e){
 if(!dragState.isDragging)return;
 var touch=e.touches?e.touches[0]:e;
 var dx=touch.clientX-dragState.startX;
 var dy=touch.clientY-dragState.startY;
 if(Math.abs(dx)>5||Math.abs(dy)>5){
 dragState.moved=true;
 }
 var x=touch.clientX-dragState.offsetX;
 var y=touch.clientY-dragState.offsetY;
 var maxX=window.innerWidth-callFloat.offsetWidth;
 var maxY=window.innerHeight-callFloat.offsetHeight;
 x=Math.max(0,Math.min(x,maxX));
 y=Math.max(0,Math.min(y,maxY));
 callFloat.style.left=x+'px';
 callFloat.style.top=y+'px';
 callFloat.style.right='auto';
 callFloat.style.bottom='auto';
 e.preventDefault();
}
function onDragEnd(e){
 if(dragState.isDragging){
 dragState.isDragging=false;
 callFloat.classList.remove('dragging');
 callFloat.style.transition='';
 if(!dragState.moved){
 if(callMiniWindow.classList.contains('active')){
 callMiniWindow.classList.remove('active');
 }else{
 callMiniWindow.classList.add('active');
 }
 }
 dragState.moved=false;
 }
}
callFloat.addEventListener('mousedown',onDragStart);
document.addEventListener('mousemove',onDragMove);
document.addEventListener('mouseup',onDragEnd);
callFloat.addEventListener('touchstart',onDragStart,{passive:false});
document.addEventListener('touchmove',onDragMove,{passive:false});
document.addEventListener('touchend',onDragEnd);

// ====== catchUp ======
function catchUp(){
 if(data.cards.length===0)return;
 var now=Date.now();
 var diff=now-(data.lastVisit||now);
 var messagesToAdd=[];
 var remaining=diff;
 var maxIter=50;
 while(remaining>0 && maxIter>0){
 maxIter--;
 var intervalSec=Math.floor(Math.random()*(15-5+1)+5)*60;
 var intervalMs=intervalSec*1000;
 if(remaining<intervalMs) break;
 var count=Math.floor(Math.random()*3)+1;
 var baseTime=new Date(now-remaining+intervalMs);
 for(var i=0;i<count;i++){
 var msgTime=new Date(baseTime.getTime()+i*2000);
 var timeStr=String(msgTime.getHours()).padStart(2,'0')+':'+String(msgTime.getMinutes()).padStart(2,'0');
 var card=data.cards[Math.floor(Math.random()*data.cards.length)];
 messagesToAdd.push({text:card,time:timeStr,self:false});
 }
 remaining-=intervalMs;
 if(remaining<0) break;
 }
 if(messagesToAdd.length>0){
 messagesToAdd.forEach(function(msg){
 data.messages.push(msg);
 });
 saveData();
 renderMessages();
 }
 data.lastVisit=now;
 saveData();
 lastInteraction = now;
}
